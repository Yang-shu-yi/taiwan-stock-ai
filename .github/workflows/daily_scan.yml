name: Daily Taiwan Stock Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile active Python files
        run: |
          python -m py_compile alert_store.py app.py candidate_selector.py config_check.py data_layer.py market_data.py message_formatter.py news_scraper.py notifier.py rpi_intraday.py rpi_main.py signal_tracker.py stock_analyzer.py universe.py

      - name: Run tests
        run: python -m pytest

      - name: Run daily pipeline dry-run
        env:
          MODE: POST
          DRY_RUN: "true"
          ENABLE_REPORT_TELEGRAM: "false"
          ENABLE_LINE: "false"
          REPORT_DASHBOARD_URL: https://taiwan-stock-ai-cmignppyqbx3qyslpthtnz.streamlit.app/
          ENABLE_GOOGLE_SHEETS: "false"
          DAILY_CANDIDATES_FILE: runtime/daily_candidates.json
          TW_SCAN_LIMIT: "48"
          TW_CANDIDATE_LIMIT: "8"
        run: python rpi_main.py
