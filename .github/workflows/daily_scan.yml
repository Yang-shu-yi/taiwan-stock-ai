name: Daily Taiwan Stock Pipeline

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          MODE: POST
          ENABLE_TELEGRAM: "true"
          ENABLE_LINE: "false"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          TW_SCAN_LIMIT: "48"
          TW_CANDIDATE_LIMIT: "8"
        run: python rpi_main.py

      - name: Commit snapshot if changed
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add daily_candidates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily candidate snapshot" && git push)
